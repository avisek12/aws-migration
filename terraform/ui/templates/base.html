<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Landing Zone UI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">{{ cloud_icon | safe }} Landing Zone UI</a>
    <span class="warning">Local tool — creates and modifies real AWS infrastructure. Only use against accounts you're authorized to change.</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
